[package]
name = "wasmtime_deserialize_regression"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"
publish = false

[dependencies]
sha2 = { workspace = true }
# Match the compiler-free dependency used by the generated runtime. Keeping
# this dependency local prevents the workspace Wasmtime release from silently
# changing the boundary covered by this regression.
wasmtime = { git = "https://github.com/convex-in-prod/wasmtime", rev = "ba13bdffaa34c4cfa6af8ceb58275e761593a885", default-features = false, features = ["anyhow", "async", "runtime", "std", "gc-drc"] }

[build-dependencies]
sha2 = { workspace = true }
# Resolver v2 keeps the fixture producer's compiler out of the test target.
wasmtime = { git = "https://github.com/convex-in-prod/wasmtime", rev = "ba13bdffaa34c4cfa6af8ceb58275e761593a885", default-features = false, features = ["anyhow", "async", "runtime", "std", "gc-drc", "gc-null", "cranelift"] }

[lints]
workspace = true
