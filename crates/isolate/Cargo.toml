[package]
name = "isolate"
version = "0.1.0"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

build = "build.rs"
include = ["data"]

[package.metadata.cargo-machete]
ignored = [
    "axum",
    "http-body-util",
    "hyper",
    "js_build",
    "must-let",
    "phf",
    "pretty_assertions",
    "reqwest",
    "search",
    "search_index_workers",
    "sha2",
    "shape_inference",
    "walkdir",
]

[lib]
doctest = false

[features]
# Keep the earlier Wasm provider available as an explicitly opt-in comparison
# path while the generated Static Hermes gate remains separately controlled.
wasm-udf = ["dep:wasm_runtime"]
testing = [
    "common/testing",
    "database/testing",
    "errors/testing",
    "keybroker/testing",
    "maplit",
    "metrics/testing",
    "model/testing",
    "must-let",
    "proptest",
    "reqwest",
    "roles/testing",
    "runtime/testing",
    "search/testing",
    "search_index_workers/testing",
    "storage/testing",
    "usage_tracking/testing",
    "value/testing",
    "vector/testing",
    "udf/testing",
    "convex_macro/testing",
    "dep:wasm-encoder",
    "wasmtime?/cranelift",
]
static-hermes-wasmtime-gate = [
    "dep:aws-lc-rs",
    "dep:ryu-js",
    "dep:sha2",
    "dep:tempfile",
    "dep:wasmtime",
    "wasmtime?/cranelift",
]
tracy-tracing = ["common/tracy-tracing"]

[dependencies]
ai_gateway_jwt = { workspace = true }
anyhow = { workspace = true }
aws-lc-rs = { workspace = true, optional = true }
async-broadcast = { workspace = true }
async-recursion = { workspace = true }
async-trait = { workspace = true }
async_lru = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
cmd_util = { workspace = true }
common = { workspace = true }
convex_macro = { workspace = true }
database = { workspace = true }
deno_core = { workspace = true }
deno_core_icudata = { workspace = true }
derive_more = { workspace = true }
encoding_rs = { workspace = true }
errors = { workspace = true }
event-listener = { workspace = true }
fastrace = { workspace = true }
file_storage = { workspace = true }
futures = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
humansize = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
keybroker = { workspace = true }
maplit = { workspace = true, optional = true }
metrics = { workspace = true }
mime = { workspace = true }
model = { workspace = true }
multer = { workspace = true }
must-let = { workspace = true, optional = true }
parking_lot = { workspace = true }
paste = { workspace = true }
pb = { workspace = true }
phf = { workspace = true }
prometheus = { workspace = true }
proptest = { workspace = true, optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
roles = { workspace = true }
runtime = { workspace = true }
ryu-js = { workspace = true, optional = true }
scopeguard = { workspace = true }
search = { workspace = true }
search_index_workers = { workspace = true, optional = true }
semver = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
slab = { workspace = true }
sourcemap = { workspace = true }
storage = { workspace = true }
strum = { workspace = true }
sync_types = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
udf = { workspace = true }
url = { workspace = true }
usage_tracking = { workspace = true }
uuid = { workspace = true }
value = { workspace = true }
vector = { workspace = true }
wasm_runtime = { workspace = true, optional = true }
wasm-encoder = { workspace = true, optional = true }
# Keep the generated-runtime gate on its pinned engine while wasm_runtime
# remains on the workspace Wasmtime/wasmtime-wasi pair.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7ad2e732ab9ca8665d3cdd91f9c395315eeafc81", default-features = false, features = ["anyhow", "async", "runtime", "std", "gc-null"], optional = true }
webcrypto = { workspace = true }

[target."cfg(not(windows))".dependencies]
libc = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
js_build = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
async-broadcast = { workspace = true }
common = { workspace = true, features = ["testing"] }
convex_macro = { workspace = true, features = ["testing"] }
database = { workspace = true, features = ["testing"] }
divan = { workspace = true }
errors = { workspace = true, features = ["testing"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
indexing = { workspace = true, features = ["testing"] }
keybroker = { workspace = true, features = ["testing"] }
maplit = { workspace = true }
metrics = { workspace = true, features = ["testing"] }
model = { workspace = true, features = ["testing"] }
must-let = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
roles = { workspace = true, features = ["testing"] }
runtime = { workspace = true, features = ["testing"] }
search = { workspace = true, features = ["testing"] }
search_index_workers = { workspace = true, features = ["testing"] }
shape_inference = { workspace = true, features = ["testing"] }
sqlite = { workspace = true }
storage = { workspace = true, features = ["testing"] }
udf = { workspace = true, features = ["testing"] }
usage_tracking = { workspace = true, features = ["testing"] }
value = { workspace = true, features = ["testing"] }
vector = { workspace = true, features = ["testing"] }
wasm-encoder = { workspace = true }
# Runtime builds consume authenticated precompiled modules. Tests retain a
# compiler for constructing exact fixture artifacts from Core Wasm.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "7ad2e732ab9ca8665d3cdd91f9c395315eeafc81", default-features = false, features = ["anyhow", "async", "runtime", "std", "gc-null", "cranelift"] }

[[bench]]
name = "new_context"
harness = false

[lints]
workspace = true
